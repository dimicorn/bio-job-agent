# DeepSeek through Pi:
# analyst:
#   backend: pi
#   provider: deepseek
#   model: deepseek-flash
#   api_key_env: DEEPSEEK_API_KEY

# Browser modes require reviewed materials and explicit approval in review.
search:
  # Set to 0 or null to disable; unknown first-sync dates remain visible.
  max_posting_age_days: 7

apply:
  company_cooldown_days: 30
  mode: manual  # manual | assisted | auto
  daily_limit: 5
  max_per_run: 5
  min_score: 80
  active_hours: [8, 23]  # local time, inclusive start / exclusive end
  answers_file: answers.yaml
  profile_dir: data/browser-profile  # Private persistent Chromium profile, gitignored
  audit_dir: debug/apply              # Private filled/confirmation screenshots, gitignored
  submit_wait_minutes: 10             # Assisted: wait for the person and confirmation
  confirmation_timeout_seconds: 45    # Auto: require acknowledgement after one click
  action_seconds: 0.3                 # Pause between field actions

# One pass: uv run bio-jobs watch; scheduling is offered by ./setup.sh (default no).
watch:
  min_score: null         # null inherits analyst.min_score
  notify: true           # macOS notifications; above 3 jobs, send one summary
  telegram: false        # Optional bot digest; secrets in .env, never in YAML
  digest_dir: digests     # Relative to config.yaml; gitignored
