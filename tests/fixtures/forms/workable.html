<!doctype html><html><body><h1>Apply</h1><form>
<label for="firstname">First name *</label><input id="firstname" name="firstname" data-ui="firstname" required>
<label for="lastname">Last name *</label><input id="lastname" name="lastname" required>
<label for="email">Email *</label><input id="email" name="email" type="email" required>
<label for="resume">Resume *</label><input id="resume" type="file" data-ui="resume" required>
<label for="letter">Cover Letter</label><textarea id="letter" name="cover_letter"></textarea>
<div role="group" data-ui="focus" aria-labelledby="focus-label" aria-required="true">
<span id="focus-label">Research focus *</span>
<div role="checkbox" aria-label="Cell assays" aria-checked="false" onclick="this.setAttribute('aria-checked',this.getAttribute('aria-checked')==='true'?'false':'true')">Cell assays</div>
<div role="checkbox" aria-label="Other" aria-checked="true" onclick="this.setAttribute('aria-checked',this.getAttribute('aria-checked')==='true'?'false':'true')">Other</div></div>
<!--EXTRA--><button type="submit" data-ui="apply-button">Submit Application</button></form>
<script>window.__submissions=0; document.querySelector('form').addEventListener('submit', e => {e.preventDefault(); window.__submissions++; /*RESULT*/});</script>
</body></html>
