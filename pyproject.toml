[project]
name = "bio-job-agent"
version = "0.1.0"
description = "Local single-user London industry scientist job discovery"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "PyYAML>=6,<7", "beautifulsoup4>=4.12,<5", "streamlit>=1.45,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
bio-jobs = "app.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "migrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: opt-in real network checks"]
addopts = "-m 'not live'"

[tool.ruff]
target-version = "py312"
line-length = 100
