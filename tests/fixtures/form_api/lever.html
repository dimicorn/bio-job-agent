<!DOCTYPE html>
<html><body>
<form id="application-form" method="POST"><div class="section application-form"><ul>
<li class="application-question resume"><label><div class="application-label">Resume/CV </div><div class="application-field"><input class="application-file-input" name="resume" type="file"></div></label></li>
<li class="application-question"><label><div class="application-label">Full name<span class="required">&#x2731;</span></div><div class="application-field"><input type="text" name="name" required></div></label></li>
<li class="application-question"><label><div class="application-label">Email<span class="required">&#x2731;</span></div><div class="application-field"><input name="email" type="email" required></div></label></li>
<li class="application-question"><label><div class="application-label">Phone </div><div class="application-field"><input type="text" name="phone"></div></label></li>
<li class="application-question"><label><div class="application-label">Current location </div><div class="application-field"><input type="text" name="location"><input type="hidden" name="selectedLocation"></div></label></li>
<li class="application-question"><label><div class="application-label">LinkedIn URL</div><div class="application-field"><input type="text" name="urls[LinkedIn]"></div></label></li>
</ul></div>
<div class="section application-form"><input type="hidden" name="cards[c1][baseTemplate]" value="{}"><ul>
<li class="application-question custom-question"><div><div class="application-label"><div class="text">Describe your synthetic assay experience.<span class="required">&#x2731;</span></div></div><div class="application-field"><textarea name="cards[c1][field0]"></textarea></div></div></li>
<li class="application-question custom-question"><div><div class="application-label"><div class="text">Are you able to work on site?</div></div><div class="application-field"><ul><li><label><input type="radio" name="cards[c1][field1]" value="Yes">Yes</label></li><li><label><input type="radio" name="cards[c1][field1]" value="No">No</label></li></ul></div></div></li>
<li class="application-question custom-question"><div><div class="application-label"><div class="text">Preferred start month</div></div><div class="application-field"><select name="cards[c1][field2]"><option value="">Select</option><option value="jan">January</option><option value="feb">February</option></select></div></div></li>
</ul></div>
<div class="section application-form"><ul>
<li class="application-question"><label><div class="application-label">Gender</div><div class="application-field"><select name="eeo[gender]"><option value="x">Prefer not to say</option></select></div></label></li>
</ul></div>
<button id="btn-submit" type="button">Submit application</button>
</form></body></html>
