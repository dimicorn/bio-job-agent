# Recheck every board and employer identity: bio-jobs firms --validate
# token: public ATS slug, or an exact verified HTTPS careers URL for site.
# tier: 1 = priority, 2 = broader scientific coverage, 3 = supporting suppliers.
# evidence_url + industry_evidence record the employer's own industry evidence.
# area is watchlist context; individual jobs still pass the candidate region filters.
# site without links: a content-hashed public page snapshot, retained in raw_postings
# for manual review; generic career-page updates are not advertised as scientist jobs.
# This does not query undocumented Workday APIs or execute JavaScript.
#
# No compliant public ATS feed found/usable on this check:
# GSK, AstraZeneca, Lonza: own career pages / Workday; use verified site watchers below.
# LabGenius: own careers page (Teamtailor, outside the API adapters); site watcher.
# RxCelerate: own careers page; site watcher.
# Autolus (London/Stevenage): https://www.autolus.com/careers/ links to
# autolus.wd103.myworkdayjobs.com, but direct public GET returned HTTP 403;
# excluded rather than bypassing access restrictions or inventing a Workday API.


