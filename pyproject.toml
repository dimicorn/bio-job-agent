[project]
name = "bio-job-agent"
dynamic = ["version"]  # from the git tag vX.Y.Z (hatch-vcs), see CONTRIBUTING.md
description = "Local single-user London industry scientist job discovery"
requires-python = ">=3.12"
dependencies = ["httpx>=0.28,<1", "pydantic>=2.10,<3", "pydantic-settings>=2.7,<3", "python-dotenv>=1,<2", "PyYAML>=6,<7", "beautifulsoup4>=4.12,<5", "rich>=13,<15", "markdown>=3.7,<4", "pdfminer-six>=20240706", "playwright>=1.49,<2"]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[project.scripts]
bio-jobs = "app.cli:main"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.build.targets.wheel]
packages = ["app", "migrations"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: opt-in real network checks"]
addopts = "-m 'not live'"

[tool.ruff]
target-version = "py312"
line-length = 100
