# Run ./setup.sh to create config.yaml and save credentials in gitignored .env.
resume: resume.md                    # Relative to this config file; local and gitignored
analyst:
  # Optional letter guidance; default length is 150–250 words.
  letter_style: ""
  letter_length: ""
  preferences: ""                   # Desired roles, locations, salary and working arrangements
  batch_size: 5
  parallel: 2
  min_score: 50                      # list/review/export gate; --all-scores bypasses it
  weights:                          # Must sum to 100
    specialization: 30
    technical: 20
    seniority_leadership: 15
    industry_therapeutic: 10
    geography: 10
    research_outcomes: 10
    salary_arrangements: 5
  backend: opencode                  # codex | claude_code | api | openai | command | opencode | pi
  provider: opencode                 # opencode/pi provider ID, e.g. deepseek
  model: deepseek-v4.1-flash-free     # CLI model ID without provider/ prefix
  base_url: null                     # openai: URL before /chat/completions
  api_key_env: null                  # Environment variable name; null for no key
  openai_extra: {}                   # Optional request fields, e.g. {temperature: 0}
  command: null                      # command: prompt on stdin, JSON on stdout; absolute script paths
  codex_model: null                  # null uses the CLI default
  codex_effort: null                 # Optional Codex reasoning effort
  timeout: 120                       # Per request/CLI timeout in seconds, maximum 900
  max_tokens: 12000                  # API output token budget for detailed batches
  fallback_backend: null             # Only used for rate/quota limits, not arbitrary errors
  fallback_settings: {}              # Overrides for fallback; may use the same backend with another endpoint
  input_cost_per_million: null       # Optional current provider rates; null = unknown cost
  output_cost_per_million: null

# Direct DeepSeek preset (use instead of the analyst block above):
# analyst:
#   backend: openai
#   base_url: https://api.deepseek.com/v1
#   model: deepseek-flash
