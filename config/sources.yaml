# Only reviewed commercial employers. Never add universities or general aggregators.
# Exception: official life-sciences job board feeds (adapter jsonfeed), whose postings are
# vetted one by one by the board filters (see docs/search.md).
watchlist: ../firms.yaml
sources:
  - id: mytos-lever
    adapter: lever
    board: mytos
    employer: Mytos
    industry: cdmo
    industry_verified: true
    employer_url: https://www.mytos.bio/
    review_url: https://jobs.lever.co/mytos
    enabled: true
    min_interval_seconds: 900
  - id: isomorphic-greenhouse
    adapter: greenhouse
    board: isomorphiclabs
    employer: Isomorphic Labs
    industry: biotech
    industry_verified: true
    employer_url: https://www.isomorphiclabs.com/
    review_url: https://job-boards.greenhouse.io/isomorphiclabs
    enabled: true
    min_interval_seconds: 900
  - id: recursion-greenhouse
    adapter: greenhouse
    board: recursionpharmaceuticals
    employer: Recursion
    industry: biotech
    industry_verified: true
    employer_url: https://www.recursion.com/
    review_url: https://job-boards.greenhouse.io/recursionpharmaceuticals
    enabled: false  # Verified feed, no London locations returned on 2026-11-15.
    min_interval_seconds: 900
  # Official JSON Feed listed in robots.txt; CC BY 4.0. The board asks for at most one poll
  # per hour. Each posting names its own employer; industry_verified reviews the board.
  - id: biotechnologyjobs-jsonfeed
    adapter: jsonfeed
    board: https://biotechnologyjobs.co.uk/jobs.json
    employer: Biotechnology Jobs
    industry: biotech
    industry_verified: true
    employer_url: https://biotechnologyjobs.co.uk/
    review_url: https://biotechnologyjobs.co.uk/feeds
    enabled: true
    min_interval_seconds: 3600
